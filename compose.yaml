# opencord: a Discord front end to OpenCode.
#
#   discord-bridge  - Discord bot. Holds the bot token. Talks to the agent's API.
#   opencode-agent  - OpenCode server + the sandbox. Users effectively own this one.
#   llm-proxy       - Holds the DeepSeek key and forwards model calls.
#
# Nothing from the host is mounted. Each secret is passed only to the container
# that needs it (env_file per service). The agent's egress firewall blocks the
# host, your LAN and the other containers except the proxy.

name: opencord

x-hardening: &hardening
  # The commit start.sh / start.ps1 deployed, shown by their status command and
  # in Docker Desktop. "-dirty" means it had uncommitted changes.
  labels:
    opencord.revision: "${OPENCORD_REVISION:-unknown}"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  llm-proxy:
    <<: *hardening
    build: ./llm-proxy
    env_file: [./secrets/proxy.env]
    environment:
      # Sized for up to 16 parallel sessions (MAX_CONCURRENT in bridge.env).
      RATE_LIMIT_PER_MINUTE: "240"
    networks: [llm-net, proxy-egress]
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  opencode-agent:
    <<: *hardening
    # Built from the whole folder so the image can carry a read-only copy of
    # it at /opt/opencord, for questions about this system. The root
    # .dockerignore keeps secrets/ out.
    build:
      context: .
      dockerfile: opencode-agent/Dockerfile
      args:
        REVISION: "${OPENCORD_REVISION:-unknown}"
    env_file: [./secrets/shared.env]
    environment:
      ALLOW_INTERNAL: "llm-proxy:8080"
    # NET_ADMIN/NET_RAW: set up the firewall. SETUID/SETGID/SETPCAP: drop to the
    # "node" user and clear every capability before OpenCode starts.
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    # Public resolvers: Docker's default upstream DNS often sits in a private
    # range (Docker Desktop's always does), which the egress firewall blocks.
    dns: [1.1.1.1, 9.9.9.9]
    networks:
      agent-egress: { gw_priority: 10 }
      llm-net: {}
      bridge-net: {}
    volumes:
      - work:/work
      - agent-data:/home/node/.local/share/opencode
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024
    depends_on:
      llm-proxy: { condition: service_healthy }

  discord-bridge:
    <<: *hardening
    build: ./discord-bridge
    env_file: [./secrets/bridge.env, ./secrets/shared.env]
    environment:
      OPENCODE_URL: "http://opencode-agent:4096"
    networks: [bridge-net, bridge-egress]
    volumes:
      - bridge-data:/data
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      opencode-agent: { condition: service_healthy }

networks:
  # Internal networks have no route to the outside world.
  llm-net: { internal: true }      # agent -> proxy
  bridge-net: { internal: true }   # bridge -> agent API
  # One egress network per container so they can't reach each other that way.
  proxy-egress: {}
  agent-egress: {}
  bridge-egress: {}

volumes:
  work: {}         # /work/sandbox, the folder every session works in
  agent-data: {}   # OpenCode sessions
  bridge-data: {}  # the bridge's thread map, per-thread settings and open questions
